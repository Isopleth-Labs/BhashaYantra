services:
  libretranslate:
    image: libretranslate/libretranslate:v1.9.6
    container_name: bhashayantra-libretranslate
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      LT_DISABLE_WEB_UI: "true"
      LT_LOAD_ONLY: "en,hi,bn"
      LT_UPDATE_MODELS: "true"

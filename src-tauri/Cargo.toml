[package]
name = "bhashayantra"
version = "0.1.0"
description = "Hindi typing, conversion, practice, and stenography desktop suite"
authors = ["BhashaYantra"]
edition = "2021"

[lib]
name = "bhashayantra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
